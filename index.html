<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mars 3D – excursion planner</title>
<link rel="stylesheet" href="style.css">

<!-- CesiumJS (if you get a 404, change the version number in both lines) -->
<script src="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Cesium.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/cesium@1.121.1/Build/Cesium/Widgets/widgets.css">

<style>
  :root {
    --panel: #2a1d19;
    --panel-line: #4a352d;
    --sand: #f1e4d6;
    --muted: #b9a594;
    --sky: #7fb3d5;
  }
  html, body { margin: 0; height: 100%; background: #120c0a; font-family: system-ui, "Segoe UI", sans-serif; color: var(--sand); }
  #map { position: absolute; inset: 0; }
  #panel {
    position: absolute; top: 12px; left: 12px; width: 300px; max-height: calc(100% - 24px); overflow-y: auto;
    background: var(--panel); border: 1px solid var(--panel-line); border-radius: 10px; padding: 16px;
    box-sizing: border-box; z-index: 10;
  }
  h1 { font-size: 18px; margin: 0 0 4px; font-weight: 650; }
  .sub { margin: 0 0 14px; font-size: 13px; color: var(--muted); line-height: 1.4; }
  h2 { font-size: 14px; margin: 16px 0 8px; font-weight: 600; }
  label.layer { display: flex; align-items: center; gap: 8px; padding: 6px 0; font-size: 14px; cursor: pointer; }
  .opacity { width: 100%; margin: 0 0 6px; accent-color: var(--sky); }
  button.poi {
    display: block; width: 100%; text-align: left; margin: 0 0 6px; padding: 8px 10px; font: inherit; font-size: 14px;
    background: transparent; color: var(--sand); border: 1px solid var(--panel-line); border-radius: 6px; cursor: pointer;
  }
  button.poi:hover { border-color: var(--sky); }
  button.poi:focus-visible, input:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  .zoombar { display: flex; gap: 6px; margin-bottom: 6px; }
  .zoombar button {
    flex: 1; height: 40px; font: inherit; font-size: 14px; line-height: 1; cursor: pointer;
    background: transparent; color: var(--sand); border: 1px solid var(--panel-line); border-radius: 6px;
  }
  .zoombar button.sym { flex: 0 0 44px; font-size: 20px; }
  .zoombar button:hover { border-color: var(--sky); }
  .zoombar button:focus-visible { outline: 2px solid var(--sky); outline-offset: 2px; }
  #alt { margin-top: 6px; font-size: 12px; color: var(--muted); }
  #info { margin-top: 12px; font-size: 13px; color: var(--muted); line-height: 1.45; min-height: 2.8em; }
  #status { margin-top: 10px; font-size: 12px; color: #e8a58f; }
  @media (max-width: 600px) { #panel { width: calc(100% - 24px); max-height: 45%; } }
</style>
</head>
<body>
<div id="map"></div>

<aside id="panel">
  <h1>Mars in 3D</h1>
  <p class="sub">Pick an area, turn on data layers and plan an excursion.</p>

  <div id="mission-ui"></div>

  <h2>Data layers</h2>
  <div id="layers"></div>

  <h2>Zoom</h2>
  <div class="zoombar">
    <button id="zoomOut" class="sym" aria-label="Zoom out">−</button>
    <button id="zoomIn" class="sym" aria-label="Zoom in">+</button>
    <button id="zoomReset" aria-label="Back to the Mount Sharp start view">Reset view</button>
    <button id="zoomGlobal" aria-label="Show the whole planet">Global view</button>
  </div>
  <div id="alt">Altitude: –</div>

  <h2>Places of interest</h2>
  <div id="pois"></div>

  <div id="route-ui"></div>
  <div id="safety-ui"></div>

  <div id="info">Click a place to fly there.</div>
  <div id="status"></div>
</aside>

<script>
/* ============ 1. Configuration: what you will edit ============ */

// Mars: equatorial and polar radius in meters
const MARS = new Cesium.Ellipsoid(3396190, 3396190, 3376200);
Cesium.Ellipsoid.default = MARS;

// Mars Trek layers. Names come from the catalog:
// https://trek.nasa.gov/tiles/apidoc/trekAPI.html?body=mars
// Check each name in the catalog and adjust "level" (max zoom) if tiles are missing.
// Layers are drawn in list order: the last one is on top.
const TREK = "https://trek.nasa.gov/tiles/Mars/EQ";
const LAYERS = [
  { id: "viking",   label: "Color imagery (Viking)",         name: "Viking_MDIM21_ClrMosaic_global_232m",             ext: "jpg", level: 7,  on: true,  alpha: 1.0 },
  // CTX is grayscale (single band): blended with Viking's color through transparency.
  { id: "gale_ctx", label: "Gale high-res imagery (CTX)",    name: "Gale_CTX_BlockAdj_dd",                            ext: "png", level: 11, on: true,  alpha: 0.8 },
  { id: "mola",     label: "Colored relief (MOLA)",          name: "Mars_MGS_MOLA_ClrShade_merge_global_463m",        ext: "jpg", level: 6,  on: false, alpha: 0.4 },
  // Coverage limited to ±65° latitude. If the layer stays empty, switch ext to "jpg".
  { id: "themis",   label: "Thermal infrared (THEMIS)",      name: "THEMIS_DayIR_ControlledMosaics_100m_v2_oct2018",  ext: "png", level: 7,  on: false, alpha: 0.7 }
];

// Start view on the mission site (Gale Crater / Mount Sharp area)
const START_VIEW = Cesium.Cartesian3.fromDegrees(137.45, -5.0, 250000, MARS);
const GLOBAL_VIEW = Cesium.Cartesian3.fromDegrees(60, 10, 2.4e7, MARS);

// Places of interest (latitude, longitude: east positive)
const POIS = [
  { name: "Gale Crater – Mount Sharp", lat: -5.4,  lon: 137.8,  note: "Area explored by Curiosity, where boxwork formations were studied." },
  { name: "Jezero Crater",             lat: 18.4,  lon: 77.5,   note: "Ancient river delta, explored by Perseverance." },
  { name: "Olympus Mons",              lat: 18.65, lon: -133.8, note: "The largest known volcano in the solar system." },
  { name: "Valles Marineris",          lat: -14.0, lon: -59.0,  note: "Canyon system thousands of kilometers long." }
];

/* ============ 2. Globe creation ============ */

const viewer = new Cesium.Viewer("map", {
  baseLayer: false,                       // no Earth imagery
  globe: new Cesium.Globe(MARS),
  mapProjection: new Cesium.GeographicProjection(MARS),
  baseLayerPicker: false, geocoder: false, homeButton: false, sceneModePicker: false,
  navigationHelpButton: false, animation: false, timeline: false, fullscreenButton: false,
  infoBox: false, selectionIndicator: false,
  skyAtmosphere: false, skyBox: false       // no Earth atmosphere or sky
});
if (viewer.scene.skyAtmosphere) viewer.scene.skyAtmosphere.show = false;
viewer.scene.globe.showGroundAtmosphere = false;
viewer.scene.globe.baseColor = Cesium.Color.fromCssColorString("#6b3a28");
viewer.scene.backgroundColor = Cesium.Color.fromCssColorString("#120c0a");

viewer.camera.setView({ destination: START_VIEW });

/* ============ 2b. Zoom ============ */

// Limits: you can get as close as 2 km to the ground and as far as 40,000 km
const controller = viewer.scene.screenSpaceCameraController;
controller.minimumZoomDistance = 2000;
controller.maximumZoomDistance = 4.0e7;

const cameraHeight = () => viewer.camera.positionCartographic.height;

document.getElementById("zoomIn").addEventListener("click", () => viewer.camera.zoomIn(cameraHeight() * 0.4));
document.getElementById("zoomOut").addEventListener("click", () => viewer.camera.zoomOut(cameraHeight() * 0.6));
document.getElementById("zoomReset").addEventListener("click", () => {
  viewer.camera.flyTo({ destination: START_VIEW, duration: 2 });
});
document.getElementById("zoomGlobal").addEventListener("click", () => {
  viewer.camera.flyTo({ destination: GLOBAL_VIEW, duration: 2 });
});

// Shows the camera altitude (useful to know the viewing scale)
const altLabel = document.getElementById("alt");
viewer.camera.changed.addEventListener(() => {
  const km = cameraHeight() / 1000;
  altLabel.textContent = "Altitude: " + (km >= 100 ? Math.round(km).toLocaleString("en-US") : km.toFixed(1)) + " km";
});
viewer.camera.percentageChanged = 0.05;

/* ============ 3. Data layers ============ */

const status = document.getElementById("status");
const layerBox = document.getElementById("layers");
const imageryLayers = {};

function makeProvider(cfg) {
  const provider = new Cesium.UrlTemplateImageryProvider({
    url: `${TREK}/${cfg.name}/1.0.0/default/default028mm/{z}/{y}/{x}.${cfg.ext}`,
    tilingScheme: new Cesium.GeographicTilingScheme({ ellipsoid: MARS }),
    maximumLevel: cfg.level,
    credit: "NASA/JPL – Mars Trek"
  });
  provider.errorEvent.addEventListener(() => {
    status.textContent = "Some tiles fail to load: check the layer name and the maximum zoom level.";
  });
  return provider;
}

LAYERS.forEach(cfg => {
  const layer = viewer.imageryLayers.addImageryProvider(makeProvider(cfg));
  layer.show = cfg.on;
  layer.alpha = cfg.alpha;
  imageryLayers[cfg.id] = layer;

  const row = document.createElement("div");
  row.innerHTML = `
    <label class="layer"><input type="checkbox" ${cfg.on ? "checked" : ""}> ${cfg.label}</label>
    <input class="opacity" type="range" min="0" max="1" step="0.05" value="${cfg.alpha}" aria-label="Opacity: ${cfg.label}">`;
  const [check, slider] = [row.querySelector("input[type=checkbox]"), row.querySelector(".opacity")];
  check.addEventListener("change", () => { layer.show = check.checked; });
  slider.addEventListener("input", () => { layer.alpha = parseFloat(slider.value); });
  layerBox.appendChild(row);
});

/* ============ 4. Places of interest ============ */

const poiBox = document.getElementById("pois");
const info = document.getElementById("info");

POIS.forEach(p => {
  viewer.entities.add({
    position: Cesium.Cartesian3.fromDegrees(p.lon, p.lat, 0, MARS),
    point: { pixelSize: 10, color: Cesium.Color.fromCssColorString("#7fb3d5"), outlineColor: Cesium.Color.WHITE, outlineWidth: 2 },
    label: {
      text: p.name, font: "14px system-ui", fillColor: Cesium.Color.WHITE, outlineColor: Cesium.Color.BLACK, outlineWidth: 3,
      style: Cesium.LabelStyle.FILL_AND_OUTLINE, pixelOffset: new Cesium.Cartesian2(0, -22),
      distanceDisplayCondition: new Cesium.DistanceDisplayCondition(0, 3e7)
    }
  });

  const btn = document.createElement("button");
  btn.className = "poi";
  btn.textContent = p.name;
  btn.addEventListener("click", () => {
    info.textContent = p.note;
    viewer.camera.flyTo({
      destination: Cesium.Cartesian3.fromDegrees(p.lon, p.lat - 1.5, 450000, MARS),
      orientation: { heading: 0, pitch: Cesium.Math.toRadians(-50), roll: 0 },
      duration: 3
    });
  });
  poiBox.appendChild(btn);
});
</script>

<!-- Project modules (separate files, must stay AFTER the script above) -->
<script src="config.js"></script>
<script src="route.js"></script>
<script src="mission.js"></script>
<script src="safety.js"></script>
</body>
</html>
